[project]
name = "historical-corpus-pod"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "numpy==2.3.5",
  "turbovec==1.0.0",
]

[project.optional-dependencies]
models = [
  "torch==2.13.0",
  "transformers==5.16.1",
]
dev = [
  "httpx2==2.12.0",
  "pytest==9.0.2",
]
preview = [
  "PyMuPDF==1.28.2",
]
ingest = [
  "PyMuPDF==1.28.2",
  "PyYAML==6.0.2",
  "paddleocr==3.7.0",
  "paddlex==3.7.2",
  "httpx2==2.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
