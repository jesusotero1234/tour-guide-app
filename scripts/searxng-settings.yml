# Local SearXNG settings override for tour-guide-app (V8 plan).
# Based on the official settings.yml (searxng/searxng master) with the
# minimal changes required for the local JSON discovery provider:
#   - enable the json output format (official default only enables html,
#     and /search?format=json returns 403 otherwise)
#   - keep server private (limiter disabled, bind to all interfaces inside
#     the container so the Firecrawl api container can reach it over the
#     podman bridge network; the published port remains 127.0.0.1 only)
# Secrets are supplied through the environment (SEARXNG_SECRET).

use_default_settings: true

search:
  formats:
    - html
    - json

server:
  # The official image applies SEARXNG_* environment overrides on top of
  # this file at load time (see searx/settings_loader.py); SEARXNG_SECRET
  # from the compose environment replaces this placeholder.
  secret_key: "searxng-local-dev-secret-change-me"
  limiter: false
  bind_address: "0.0.0.0"
