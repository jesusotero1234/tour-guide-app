version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - API_KEYS=development-api-key
      - LLM_SERVICE_URL=http://localhost:3002
      - VERIFICATION_SERVICE_URL=http://verification-pod:3003
      - DESCRIPTION_SERVICE_URL=http://description-pod:3004
      - TTS_SERVICE_URL=http://tts-pod:3005
      - SUPABASE_SERVICE_URL=http://supabase-pod:3006
      - USE_SERVICE_NAMES=false  # Set to true in production
      - HOST_SYSTEM=host.containers.internal
    depends_on:
      - llm-pod
      - verification-pod
      - description-pod
      - tts-pod
      - supabase-pod
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"

  llm-pod:
    build: 
      context: ./pods/llm-pod
      dockerfile: Dockerfile
    network_mode: "host"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - OLLAMA_HOST=http://localhost:11434
      - OLLAMA_MODEL=llama3.2:latest

  verification-pod:
    build: 
      context: ./pods/verification-pod
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - LLM_SERVICE_URL=http://llm-pod:3002
      - LLM_POD_URL=http://host.docker.internal:3002
    depends_on:
      - llm-pod
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"

  description-pod:
    build: 
      context: ./pods/description-pod
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - LLM_SERVICE_URL=http://llm-pod:3002
      - LLM_POD_URL=http://host.docker.internal:3002
    depends_on:
      - llm-pod
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"

  tts-pod:
    build: 
      context: ./pods/tts-pod
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - BASE_URL=http://localhost:3005
    volumes:
      - tts_models:/app/models
      - tts_cache:/app/cache
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"

  supabase-pod:
    build: 
      context: ./pods/supabase-pod
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
    env_file:
      - ./pods/supabase-pod/.env
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"

volumes:
  tts_models:
  tts_cache:
