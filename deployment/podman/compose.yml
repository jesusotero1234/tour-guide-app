version: '3.8'

services:
  backend:
    build:
      context: ./containers/backend
      dockerfile: Containerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - LLM_POD_URL=http://llm-pod:3002
      - VERIFICATION_POD_URL=http://verification-pod:3003
      - DESCRIPTION_POD_URL=http://description-pod:3004
      - TTS_POD_URL=http://tts-pod:3005
      - SUPABASE_POD_URL=http://supabase-pod:3006
    depends_on:
      - llm-pod
      - verification-pod
      - description-pod
      - tts-pod
      - supabase-pod

  llm-pod:
    build:
      context: ./containers/llm-pod
      dockerfile: Containerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002

  verification-pod:
    build:
      context: ./containers/verification-pod
      dockerfile: Containerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - LLM_POD_URL=http://llm-pod:3002
    depends_on:
      - llm-pod

  description-pod:
    build:
      context: ./containers/description-pod
      dockerfile: Containerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - LLM_POD_URL=http://llm-pod:3002
    depends_on:
      - llm-pod

  tts-pod:
    build:
      context: ./containers/tts-pod
      dockerfile: Containerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
    volumes:
      - tts_models:/app/models
      - tts_cache:/app/cache

  supabase-pod:
    build:
      context: ./containers/supabase-pod
      dockerfile: Containerfile
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
    env_file:
      - ../../pods/supabase-pod/.env

volumes:
  tts_models:
  tts_cache:
