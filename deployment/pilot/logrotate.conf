# Install as /etc/logrotate.d/tour-pilot only for a deployment writing these files.
# Run logrotate daily; retain seven rotated daily files, no request/access logging.
/var/log/tour-pilot/*.log {
    daily
    rotate 7
    maxage 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su tour-pilot tour-pilot
}
