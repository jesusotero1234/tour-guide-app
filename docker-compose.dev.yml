version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  postgres-local:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tour_guide_local
      - POSTGRES_USER=tour_guide
      - POSTGRES_PASSWORD=tour_guide_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tour_guide -d tour_guide_local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    network_mode: "host"
    environment:
      - NODE_ENV=development
      - API_KEYS=development-api-key
      - DATABASE_URL=postgresql://tour_guide:tour_guide_dev@localhost:5432/tour_guide_local?schema=public
      - LLM_SERVICE_URL=http://localhost:3002
      - VERIFICATION_SERVICE_URL=http://verification-pod:3003
      - DESCRIPTION_SERVICE_URL=http://description-pod:3004
      - TTS_SERVICE_URL=http://localhost:3005
      - SUPABASE_SERVICE_URL=http://supabase-pod:3006
      - USE_SERVICE_NAMES=false  # Set to true in production
      - HOST_SYSTEM=localhost
    depends_on:
      - llm-pod
      - verification-pod
      - description-pod
      - tts-pod
      - supabase-pod
    # Development additions for hot reloading
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./backend:/app:ro  # Mount local files as read-only
      - /app/node_modules  # Preserve container's node_modules
      - ./backend/data/audio:/app/data/audio  # Allow local audio files in dev

  llm-pod:
    build: 
      context: ./pods/llm-pod
      dockerfile: Dockerfile
    network_mode: "host"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - OLLAMA_HOST=${OLLAMA_HOST:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
    # Development additions for hot reloading
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./pods/llm-pod:/app:ro  # Mount local files as read-only
      - /app/node_modules  # Preserve container's node_modules

  verification-pod:
    build: 
      context: ./pods/verification-pod
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - LLM_SERVICE_URL=http://llm-pod:3002
      - LLM_POD_URL=http://host.docker.internal:3002
    depends_on:
      - llm-pod
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    # Development additions for hot reloading
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./pods/verification-pod:/app:ro  # Mount local files as read-only
      - /app/node_modules  # Preserve container's node_modules

  description-pod:
    build: 
      context: ./pods/description-pod
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - LLM_SERVICE_URL=http://llm-pod:3002
      - LLM_POD_URL=http://host.docker.internal:3002
    depends_on:
      - llm-pod
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    # Development additions for hot reloading
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./pods/description-pod:/app:ro  # Mount local files as read-only
      - /app/node_modules  # Preserve container's node_modules

  tts-pod:
    build: 
      context: ./pods/tts-pod
      dockerfile: Dockerfile
      target: development # Target the development stage
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - BASE_URL=http://localhost:3005
    volumes:
      # Development additions for hot reloading
      - ./pods/tts-pod:/app:ro  # Mount local files as read-only
      - /app/node_modules  # Preserve container's node_modules
      - /app/models  # Preserve container's model files downloaded during build
      - tts_cache:/app/cache
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    command: sh -c "npm ci && npm run dev"

  supabase-pod:
    build: 
      context: ./pods/supabase-pod
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
    env_file:
      - ./pods/supabase-pod/.env
    networks:
      - app-network
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.podman.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    # Development additions for hot reloading
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./pods/supabase-pod:/app:ro  # Mount local files as read-only
      - /app/node_modules  # Preserve container's node_modules

volumes:
  postgres_data:
  tts_models:
  tts_cache:
