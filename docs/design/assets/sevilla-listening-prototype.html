}

.form-select:focus-visible {

}

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {

  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;

.form-check-input[type=&quot;radio&quot;] {

  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);

}

  height: 20px;

  box-shadow: none;

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;

      &lt;h2&gt;Reales Alcázares&lt;/h2&gt;
      &lt;p&gt;Una puerta puede cambiar mucho sin dejar de ser una puerta. Puede perder parte de su arco, quedar incorporada a otro edificio o sobrevivir apenas en uno de sus apoyos.&lt;/p&gt;
      &lt;p&gt;En los Reales Alcázares, una de las pistas para entender el conjunto es precisamente esa: la jamba de un antiguo acceso. Un fragmento pequeño para empezar a contar una historia de casi mil años.&lt;/p&gt;
      &lt;p&gt;Estamos junto a un conjunto palaciego amurallado. Pero la palabra «conjunto» importa tanto como la palabra «palacio». El Alcázar es fruto de la unión de varios recintos palatinos de épocas distintas.&lt;/p&gt;
      &lt;p&gt;Lo que hoy reunimos bajo un solo nombre fue tomando forma por etapas. Para entenderlo, vamos a seguir algunas huellas de esos cambios, aunque desde el exterior no podamos contemplarlas todas.&lt;/p&gt;
      &lt;p&gt;El recinto más antiguo se remonta a mediados o finales del siglo XI. Ocupaba la zona del actual Patio de Banderas y las casas aledañas, y tenía forma cuadrangular.&lt;/p&gt;
      &lt;p&gt;Quédate con esa referencia: un patio y unas casas de hoy permiten situar el espacio de una alcazaba medieval. La historia más antigua del lugar también se busca entre direcciones y edificios posteriores.&lt;/p&gt;
    &lt;/div&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script type=&quot;application/json&quot; id=&quot;sevilla-stop-content&quot;&gt;[{&quot;name&quot;:&quot;Reales Alcázares&quot;,&quot;description&quot;:&quot;Una puerta puede cambiar mucho sin dejar de ser una puerta. Puede perder parte de su arco, quedar incorporada a otro edificio o sobrevivir apenas en uno de sus apoyos. En los Reales Alcázares, una de las pistas para entender el conjunto es precisamente esa: la jamba de un antiguo acceso. Un fragmento pequeño para empezar a contar una historia de casi mil años.\n\nEstamos junto a un conjunto palaciego amurallado. Pero la palabra «conjunto» importa tanto como la palabra «palacio». El Alcázar es fruto de la unión de varios recintos palatinos de épocas distintas. Lo que hoy reunimos bajo un solo nombre fue tomando forma por etapas. Para entenderlo, vamos a seguir algunas huellas de esos cambios, aunque desde el exterior no podamos contemplarlas todas.\n\nEl recinto más antiguo se remonta a mediados o finales del siglo XI. Ocupaba la zona del actual Patio de Banderas y las casas aledañas, y tenía forma cuadrangular. Quédate con esa referencia: un patio y unas casas de hoy permiten situar el espacio de una alcazaba medieval. La historia más antigua del lugar también se busca entre direcciones y edificios posteriores.\n\nA la altura del número 16 del Patio de Banderas estaba la única puerta de acceso conocida de aquella alcazaba. De ella se conserva la jamba norte de un arco, es decir, uno de sus apoyos laterales. Ese resto ayuda a localizar un umbral: el punto por el que se entraba en un recinto cuyo aspecto completo ya no tenemos delante.\n\nY en el número 8 se han encontrado restos del palacio de Al-Mutamid, el rey poeta. No necesitamos inventar qué escribió allí ni cómo transcurría una jornada suya. Basta con relacionar ese nombre con los restos de su palacio para que el siglo XI deje de ser solo una fecha. Hubo una residencia, y parte de su huella ha llegado hasta nosotros dentro de otro edificio.\n\nAhora cambia de escala e imagina una transformación documentada. En la Baja Edad Media, el Alcázar reunía edificios de distintas épocas, pequeños patios ajardinados y grandes huertas. Prueba a pensar en esa combinación: espacios construidos, jardines recogidos y terrenos de cultivo dentro de un mismo conjunto. Los jardines eran una parte fundamental del lugar, y su historia tampoco quedó detenida.\n\nSe reformaron en el siglo XVI y a comienzos del XVII. Aquellas intervenciones transformaron su trazado, pero conservaron una herencia musulmana concreta: los jardines compartimentados, sin vinculación entre ellos, junto con las fuentes bajas, los azulejos y los naranjos. Aquí el cambio tiene otro matiz. Reformar podía significar modificar la disposición y, al mismo tiempo, mantener una manera de concebir el jardín.\n\nHasta las naranjas tuvieron una historia más allá del recinto: se usaban para elaborar la mermelada que consumía Isabel II de Inglaterra. Es un detalle cotidiano que añade otro uso a esos jardines. Además de formar parte del palacio, daban un fruto que terminaba en una mesa muy lejana.\n\nTambién cambió la relación del Alcázar con la ciudad. En abril de 1931, el Gobierno de la Segunda República cedió el Alcázar y sus jardines al municipio de Sevilla. Y el conjunto siguió acogiendo actos de gobierno: aquí se reunió el Consejo de Ministros en 1976, presidido por Juan Carlos I, y volvió a hacerlo en 2010, esta vez sin el monarca.\n\nVuelve por un momento a aquella jamba. Un apoyo de piedra permite reconocer una entrada antigua; los jardines conservan formas heredadas dentro de un trazado reformado; los salones han seguido recibiendo nuevos usos. Así empieza a entenderse el Alcázar: prestando atención a qué permanece mientras el lugar cambia.\n\nNuestra siguiente parada será la Giralda.&quot;},{&quot;name&quot;:&quot;Giralda&quot;,&quot;description&quot;:&quot;El nombre de la Giralda empezó arriba del todo. Antes de nombrar a la torre, nombraba a la figura que la corona: una escultura de bronce que representa el Triunfo de la Fe y que también sirve de veleta. Con el tiempo, la torre se quedó con el nombre y la figura pasó a llamarse Giraldillo. Es curioso: algo que gira con el viento acabó dando nombre a todo este edificio.\n\nPero esa figura llegó cuando la torre llevaba siglos en pie. ¿Qué había aquí antes de que existiera la Giralda tal como la conocemos?\n\nPara entenderlo, podemos separar mentalmente dos partes. La inferior corresponde al alminar de la antigua mezquita de Sevilla, levantado a finales del siglo XII, en época almohade. La superior se añadió en el siglo XVI, en época cristiana, para albergar las campanas. No se construyeron a la vez: entre una y otra cambiaron el culto, el remate y la manera de utilizar la torre.\n\nDentro hay un detalle que ayuda a acercarse a su primera función: treinta y cinco rampas. Son lo bastante anchas para que quien convocaba a la población a la oración pudiera subir montado a caballo. La imagen es fácil de imaginar, pero conviene distinguir lo posible de lo que sabemos: no se ha podido constatar documentalmente que se usaran de ese modo. Lo seguro son las rampas y su anchura. Ese espacio interior forma parte del alminar que hoy queda integrado en el campanario.\n\nEn 1248, Fernando III conquistó Sevilla y la mezquita fue consagrada como templo cristiano. Sin embargo, aquel cambio no supuso que la torre recibiera de inmediato el remate que tiene ahora. Las cuatro bolas que la coronaban permanecieron hasta que un terremoto las derribó en 1356. Sobre su aspecto durante el periodo siguiente hay poca información. La transformación tuvo etapas, y no todas se conocen con el mismo detalle.\n\nEl siglo XVI sí dejó cambios que podemos contar con más precisión. Además del cuerpo superior destinado a las campanas, la torre recibió una decoración que hoy cuesta asociar a ella. Prueba a imaginarla con un color rojizo y con pinturas murales. Es un ejercicio para pensar en su aspecto de entonces, sin pretender reconstruir cada detalle.\n\nEl canónigo Francisco Pacheco diseñó el programa de imágenes y el pintor Luis de Vargas realizó los frescos entre 1553 y 1558. Había pinturas de santos a los lados de los balcones. La torre, por tanto, también se transformaba sobre su superficie: a la arquitectura se sumaban el color y las figuras.\n\nAquellas pinturas llegaron muy deterioradas a finales del siglo XIX. Se perdieron, junto con restos del color rojizo, durante la restauración realizada por Adolfo Fernández Casanova entre 1881 y 1883. Mucho después, en la restauración de 2018, se demostró que la Giralda había estado pintada de rojo en el siglo XVI. Conocer ese color perdido cambia la imagen que podemos hacernos de ella.\n\nVolvamos ahora a la figura del principio. Bartolomé Morel realizó esa alegoría de la Fe, colocada en 1568. Tiene dos cometidos reunidos en una sola pieza: representa una idea religiosa y funciona como veleta. De ahí viene el nombre que acabaría extendiéndose a la torre entera.\n\nLa Giralda reúne así algo más que una parte antigua y otra añadida. Conserva el alminar, sostiene las campanas y lleva en su nombre el recuerdo de una escultura. También tuvo colores que desaparecieron. Cuando pienses en su silueta, puedes recordar esas diferencias: cada una cuenta un momento distinto de su historia.\n\nNuestra siguiente parada es la Catedral de Santa María de la Sede de Sevilla, de la que la Giralda es hoy la torre campanario.&quot;},{&quot;name&quot;:&quot;Catedral de Santa María de la Sede de Sevilla&quot;,&quot;description&quot;:&quot;Un patio para las abluciones, un cementerio, un lugar de ferias y de predicación. Cuesta reunir usos tan distintos en un mismo espacio, pero todos forman parte de la historia del patio de los Naranjos, integrado en la catedral de Sevilla. Ese patio nos ofrece una manera de entender el conjunto desde fuera: preguntarnos cómo un lugar cambia de función y sigue formando parte de la vida de una ciudad.\n\nPara empezar, imagina el cambio de uso, sin intentar reconstruir cada detalle. Antes de ser parte de una catedral, aquel patio servía para las abluciones musulmanas. Pertenecía a la mezquita mayor. Tras la conquista cristiana de Sevilla, en 1248, la mezquita fue consagrada bajo la advocación de Santa María de la Asunción. El edificio que había acogido un culto pasó a acoger otro.\n\nConviene detenerse ahí un momento. La historia de esta catedral incluye una etapa en la que el templo cristiano utilizaba la antigua mezquita. Por eso, para entenderla, hace falta pensar tanto en las construcciones como en lo que se hacía dentro de ellas.\n\nEl patio permite seguir esa transformación con algo muy concreto. Después de la conquista se empleó como cementerio, acogió las ferias anuales de la ciudad y fue lugar de predicación. Enterrar a los muertos, celebrar una feria, escuchar una prédica: cada actividad establece una relación distinta con el mismo recinto. No hace falta suponer que ocurrieran a la vez. Basta con reconocer la variedad de usos que tuvo un espacio hoy integrado en la catedral.\n\nTambién el nombre guarda un detalle que puede pasar desapercibido. Santa María de la Sede es la advocación de una Virgen del siglo XIII que alberga el templo. Es una Virgen sedente, es decir, representada sentada. Dentro de un nombre tan solemne aparece así una imagen concreta, con una postura que resulta fácil imaginar aunque estemos en el exterior.\n\nLos siglos siguientes añadieron otras formas de construir y de utilizar el conjunto. En el XVI se realizó la sacristía mayor según el proyecto de Diego de Riaño: una construcción renacentista con rica ornamentación plateresca. La catedral reúne, por tanto, espacios de distintas épocas, vinculados a las necesidades del templo.\n\nY hay otro detalle interior que ayuda a entender su uso religioso: los 117 sitiales del coro, realizados fundamentalmente entre los siglos XV y XVI. Son asientos ligados a la oración comunitaria. El canto gregoriano está documentado en la liturgia de la catedral desde al menos 1478. Además de piedra, imágenes y ornamentación, esta historia tiene palabras y música.\n\nQuédate con aquel patio del principio. Sus distintos usos nos han permitido acercarnos a una catedral que es también una sucesión de transformaciones: espacios heredados, nuevas construcciones y prácticas religiosas. Su nombre completo puede resultar solemne; sus detalles nos acercan a las actividades para las que ha servido.\n\nSeguiremos hacia la plaza de toros de la Real Maestranza.&quot;},{&quot;name&quot;:&quot;plaza de toros de la Real Maestranza&quot;,&quot;description&quot;:&quot;Cuadrada, circular, ligeramente elíptica… La historia de la Maestranza tiene más de una forma. Y el edificio que hoy ocupa este lugar es un polígono irregular de treinta lados. ¿Cómo encajan todas esas figuras en una plaza de toros? Para entenderlo, hay que pensar en algo que se fue construyendo por etapas, con interrupciones que duraron años y obras que llegaron hasta el siglo XIX.\n\nEmpecemos por aquella plaza cuadrada. En 1707 ya existía en el Arenal un recinto así, donde los maestrantes practicaban la tauromaquia. Pero en 1733, dos maestros carpinteros, Juan de Vera y Luis de Troya, dictaminaron que estaba en ruinas. La desmontaron para hacer una circular en un lugar cercano.\n\nEl terreno elegido fue el monte del Baratillo. Hubo que allanarlo, y la Maestranza pagó esos trabajos. Antes de levantar el nuevo recinto, por tanto, fue necesario transformar el suelo. Si quieres imaginar aquel cambio, empieza por ahí: un terreno que se nivela para recibir una plaza de forma distinta a la anterior.\n\nLa institución que costeó esa operación sigue siendo propietaria del edificio: la Real Maestranza de Caballería de Sevilla. Felipe V le había concedido el título de real en 1730. Ese nombre que acompaña a la plaza pertenece, pues, a la entidad que impulsó su construcción.\n\nPero levantarla fue una tarea larga. Las obras estuvieron paralizadas entre 1766 y 1784. Más adelante, la construcción continuó con una forma ligeramente elíptica. En 1799 volvió a detenerse, esta vez por falta de recursos. Quedaba todavía un tercio de la plaza por edificar de obra.\n\nDetente un momento en esa proporción: un tercio. No faltaba solo un remate o una pieza decorativa. Una parte considerable del recinto seguía pendiente. En 1876 se encargó al arquitecto Juan Talavera de la Vega que lo terminara, y la plaza quedó finalizada en el siglo XIX. Su arquitectura es tardobarroca, característica de la segunda mitad del XVIII, aunque la historia de su construcción se prolongara mucho más.\n\nVolvamos ahora a las formas. Desde el exterior no necesitas abarcar todo el conjunto para entender una particularidad: la plaza tiene treinta lados, pero las edificaciones adosadas componen una manzana casi triangular. La delimitan el paseo de Cristóbal Colón y las calles Adriano y Antonia Díaz. Alrededor del perímetro fueron construyéndose también viviendas. El recinto taurino quedó así acompañado por otros edificios que participan en su contorno urbano.\n\nPor dentro, la organización responde a otra lógica. Un primer anillo rodea el ruedo y reúne las localidades de barrera y tendido. En un segundo anillo están dependencias como los corrales y la enfermería; por encima se levantan las gradas cubiertas, dispuestas en una galería. Esa distribución permite entender cuánto reúne una plaza además del espacio donde se celebra la corrida.\n\nIncluso después de terminarse, siguió cambiando. En 1946, Aurelio Gómez Millán reformó las dependencias destinadas a los toros y acondicionó dos accesos laterales para adaptarla al Reglamento Taurino de 1937. Entre 2005 y 2011, Antonio Carbajal Navarro la restauró.\n\nQuédate con esas distintas escalas: el terreno allanado, el tercio que faltaba, los anillos interiores y la manzana casi triangular. Ayudan a entender la Maestranza como una construcción que fue tomando forma durante generaciones. Detrás de un solo nombre hay decisiones de carpinteros, arquitectos y una institución que sostuvo la obra a lo largo del tiempo.\n\nLa siguiente parada será el Palacio de San Telmo.&quot;},{&quot;name&quot;:&quot;Palacio de San Telmo&quot;,&quot;description&quot;:&quot;Gustavo Adolfo Bécquer llegó a San Telmo con diez años para estudiar en un colegio naval. Ese dato quizá no sea lo primero que esperas escuchar junto a un palacio. Pero ayuda a plantear una pregunta: ¿cuántas cosas ha sido este edificio antes de convertirse en sede del Gobierno andaluz?\n\nEmpecemos por un detalle de su exterior. La portada principal tiene columnas con relieves a ambos lados de la entrada. Se terminó en 1734, aunque su parte superior fue reformada unas cuatro décadas después. Es decir, incluso esa portada que podemos entender como una sola obra tuvo distintos momentos de construcción.\n\nEl edificio avanzó con interrupciones largas. En 1699, las obras se pararon por falta de fondos y no se reanudaron hasta 1722, cuando Leonardo de Figueroa se encargó de continuarlas. Tras su muerte, su hijo Matías asumió la tarea de finalizar sus proyectos. Hubo nuevas suspensiones, y el edificio original no se dio por terminado hasta 1796.\n\nQuédate con esa última fecha y compárala con esta otra: la Universidad de Mareantes se había trasladado aquí en 1704. Entre ambas transcurrió casi un siglo. San Telmo ya tenía uso mucho antes de que se considerara acabado. Construirlo y habitarlo no fueron dos capítulos perfectamente separados.\n\nSu relación con la enseñanza continuó. En 1841 pasó a ser Colegio Naval Militar, y cinco años después entró aquel alumno de diez años, Gustavo Adolfo Bécquer. Aquí mostró interés por la literatura y conoció a Narciso Campillo, también futuro escritor, con quien colaboraría. Dentro de una institución naval aparece así una relación literaria: dos estudiantes cuyos nombres acabarían vinculados a la escritura.\n\nNo hace falta imaginar sus conversaciones para que el encuentro tenga interés. Basta con pensar que, entre las funciones oficiales de un edificio y la experiencia de quienes lo usan, caben historias muy distintas. Para Bécquer, San Telmo fue también un lugar donde conocer a alguien con quien escribir.\n\nEn 1847 se suprimieron las enseñanzas del colegio naval. Después, el palacio alojó brevemente una oficina de la Sociedad del Ferrocarril y fue sede del Colegio Real de Humanidades hasta julio de 1849. Los cambios se sucedían ahora mucho más deprisa que las antiguas obras.\n\nEse mismo año comenzó otra etapa. El duque de Montpensier y la infanta se instalaron aquí a principios de septiembre; la compra se formalizó en abril de 1850. Balbino Marrón realizó reformas arquitectónicas hasta su muerte, en 1867. El lugar que había recibido estudiantes se transformaba para albergar una residencia.\n\nTambién cambió la relación de sus jardines con la ciudad. En 1893, María Luisa Fernanda, ya viuda, donó al Ayuntamiento de Sevilla dieciocho hectáreas y media para que fueran un parque público. Una parte de aquellos jardines adquiría así un destino compartido.\n\nSan Telmo comenzó a ser sede del Gobierno andaluz en 1992, después de una restauración de tres años a cargo de Guillermo Vázquez Consuegra. De su edificio original se conservan principalmente la fachada principal, el patio principal y la capilla.\n\nVolvamos a la portada. Ahora sus columnas acompañan una historia que reúne obras interrumpidas, estudiantes, una residencia y funciones de gobierno. La fachada permanece, pero el nombre de «palacio» ya se queda corto para contar todo lo que ha ocurrido aquí. Y entre esos cambios podemos situar a un niño de diez años que empezaba a interesarse por la literatura.\n\nContinuaremos con la plaza de España.&quot;},{&quot;name&quot;:&quot;plaza de España&quot;,&quot;description&quot;:&quot;Cuarenta y ocho bancos, revestidos de cerámica y dedicados a provincias españolas. En una plaza de estas dimensiones, un banco puede parecer un detalle pequeño. Pero aquí esos detalles permiten leer el conjunto. Y plantean una pregunta: ¿cuánto trabajo hace falta para conservar una plaza que cuenta tantas cosas a través de su decoración?\n\nLa plaza de España fue proyectada por Aníbal González y se levantó entre 1914 y 1929. Era la construcción más grande de la Exposición Iberoamericana de 1929. Su tamaño respondía, por tanto, a una ocasión concreta: formar parte de una gran exposición. El proyecto original ya planteaba un espacio abierto hacia el Parque de María Luisa, con un estanque.\n\nPiensa en cómo se organiza ese espacio: el edificio dibuja un semicírculo, con un cuerpo central y dos torres en los extremos. La ría, los cuatro puentes y la fuente central completan la composición. La fuente es obra de Vicente Traver. Hay una escala monumental, pero también elementos que puedes ir reconociendo uno a uno.\n\nLos puentes, por ejemplo, representan cuatro antiguos reinos: León, Castilla, Aragón y Navarra. Los bancos presentan las provincias, dispuestas por orden alfabético. Y la decoración incluye cincuenta y dos medallones de personajes ilustres de la historia de España, además de escudos heráldicos. El nombre de la plaza se desarrolla así en distintos niveles: reinos, provincias y personas. No necesitas identificar cada figura para entender esa intención de reunir referencias a España en un mismo recinto.\n\nAhora volvamos a la cerámica. Es parte de lo que da continuidad a esa decoración, pero también ha exigido reparaciones importantes. En 1946, las balaustradas del interior de la plaza estaban tan deterioradas que se sustituyeron por otras de mármol rojo. Las frontales exteriores se mantuvieron de cerámica y fueron restauradas en 2009. Dentro de un mismo conjunto, la conservación tomó caminos distintos.\n\nLa gran restauración realizada entre 2002 y 2010 permite comprender la magnitud del trabajo. Hubo que sustituir por réplicas casi una cuarta parte de los azulejos de los bancos de provincias, así como el noventa por ciento de las librerías y balaustradas de cerámica. Se hicieron también veinte farolas de cerámica para la balaustrada exterior: las anteriores habían desaparecido, sin que se sepa cuándo.\n\nLos elementos cerámicos fueron restaurados por un taller creado para esta tarea por Patrimonio del Estado, el Servicio Andaluz de Empleo y el Ayuntamiento de Sevilla. Mientras duraron las obras, la ría estuvo seca. Prueba a imaginar por un momento el canal sin agua: ayuda a pensar en la plaza durante aquel proceso de reparación.\n\nAquellos cuarenta y ocho bancos cuentan, entonces, algo más que una distribución de provincias. Su cerámica también habla del esfuerzo por conservar el conjunto, pieza a pieza, recurriendo a réplicas cuando fue necesario. Esa es otra historia que puedes buscar en los detalles de esta gran plaza.\n\nDespués nos espera la Casa de Pilatos.&quot;},{&quot;name&quot;:&quot;Casa de Pilatos&quot;,&quot;description&quot;:&quot;Imagina que te encargan transformar una ventana y que, para hacerlo, tienes unas columnas de varios siglos atrás. Puedes conservarlas tal como están, dejarlas aparte o volver a tallarlas para darles otra forma. En la Casa de Pilatos ocurrió esto último. En 1861 se aprovecharon columnas de la época de Catalina de Ribera para transformar las ventanas del patio. Ese pequeño cambio nos permite plantear una pregunta: ¿cuántas épocas pueden convivir en una misma casa?\n\nEstamos junto a un palacio construido esencialmente entre los siglos XV y XVI. Su nombre más conocido es Casa de Pilatos, aunque también se llama Palacio de los Adelantados Mayores de Andalucía. Pertenece a la Casa de Medinaceli. Aquí, la palabra «casa» tiene dos sentidos que conviene mantener unidos: el edificio y el linaje al que pertenece.\n\nDesde el exterior, vamos a acercarnos a su historia a través de algunos detalles del interior. El primero es el patio. En tiempos de Pedro Enríquez y Catalina de Ribera ya era mudéjar, pero tenía forma de U y estaba abierto hacia el espacio que hoy se llama Salón del Pretorio. Prueba a dibujar mentalmente esa U: tres lados y una abertura. Nos ayuda a entender que la disposición del palacio también ha cambiado; las transformaciones no se limitaron a su decoración.\n\nEl patio principal tiene 324 metros cuadrados, sin contar las galerías. Pero, para comprender cómo se fueron encontrando distintas maneras de construir, merece la pena pensar en algo más pequeño: sus arcos. Las yeserías que los decoran mezclan motivos mudéjares y platerescos. Dos lenguajes ornamentales comparten una misma superficie. La mezcla que caracteriza al palacio llega hasta ese nivel de detalle.\n\nTambién hay zócalos de azulejos de más de tres metros de altura. Piensa en lo que significa esa medida: la cerámica ocupa una parte considerable del muro. Los escudos heráldicos aparecen tanto en esos zócalos como en la zona alta de las paredes y en la decoración sobre los capiteles. La casa como edificio y la casa como linaje vuelven a encontrarse aquí, mediante signos de identidad familiar incorporados a la arquitectura.\n\nAhora recupera aquellas columnas del principio. En 1861, las ventanas del patio se transformaron en ajimeces, ventanas divididas por columnas. Para esa intervención se retallaron piezas que ya existían desde la época de Catalina de Ribera. Había material antiguo, pero su forma se adaptó a una nueva composición. Una columna podía conservar su antigüedad y, al mismo tiempo, participar en un cambio del siglo XIX.\n\nEse ejemplo ayuda a entender por qué este palacio reúne elementos góticos, mudéjares, renacentistas y románticos. Su construcción y sus transformaciones se extendieron durante siglos. Lo que llamamos Casa de Pilatos es el resultado de ese proceso. Se considera un modelo de palacio sevillano, y resulta sugerente que ese modelo reúna aportaciones de épocas tan distintas.\n\nLa labor sobre el edificio tuvo otra etapa con la creación, en 1980, de la Fundación Casa Ducal de Medinaceli, que gestiona el inmueble. Desde entonces han continuado los proyectos de restauración, recuperación y redecoración de espacios. Son tareas que prolongan la historia de una casa cuya forma ha ido cambiando con el tiempo.\n\nAquí termina nuestro recorrido. Antes de despedirnos, quédate con aquella columna antigua, tallada de nuevo para una ventana. Es un detalle modesto para cerrar una visita, pero permite entender algo importante de este palacio: conservar y transformar han llegado a ocurrir sobre una misma pieza. La próxima vez que encuentres una mezcla de estilos en un edificio, quizá te apetezca preguntarte cómo llegaron a compartirlo. En la Casa de Pilatos, esa convivencia forma parte de su historia.&quot;}]&lt;/script&gt;
